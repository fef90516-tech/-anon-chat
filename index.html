<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Анонимный чат</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1020;
    --panel: #191a2e;
    --panel2: #21233b;
    --accent: #6c5ce7;
    --accent2: #00d2a8;
    --text: #eef0ff;
    --muted: #9aa0c0;
    --me: #6c5ce7;
    --them: #2b2e4a;
  }
  html, body {
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: radial-gradient(1200px 800px at 80% -10%, #2a2350 0%, transparent 60%),
                radial-gradient(1000px 700px at -10% 110%, #113b3a 0%, transparent 55%),
                var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  .app {
    max-width: 820px;
    margin: 0 auto;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 10px;
    padding-top: calc(10px + env(safe-area-inset-top));
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    gap: 0;
  }
  header {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .title { font-size: 18px; font-weight: 700; }
  .subtitle { font-size: 12px; color: var(--muted); }
  .status {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    background: var(--panel2);
    padding: 8px 14px; border-radius: 999px;
    font-size: 14px; font-weight: 600;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff5a5a; }
  .dot.on { background: var(--accent2); box-shadow: 0 0 10px var(--accent2); }

  .invite {
    margin-top: 12px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 16px;
    padding: 14px 18px;
  }
  .invite-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .invite-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .invite-link {
    flex: 1; min-width: 200px;
    background: var(--panel2);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 14px; font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    transition: transform .06s ease, opacity .2s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: default; }

  .chat {
    margin-top: 12px;
    flex: 1;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 16px;
    display: flex; flex-direction: column;
    overflow: hidden;
    min-height: 200px;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
    animation: pop .15s ease;
  }
  @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .msg.me {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--accent), #8f7bff);
    border-bottom-right-radius: 4px;
  }
  .msg.them {
    align-self: flex-start;
    background: var(--them);
    border-bottom-left-radius: 4px;
  }
  .msg .time { display:block; font-size: 10px; color: rgba(255,255,255,.55); margin-top: 4px; }
  .sys {
    align-self: center;
    background: rgba(255,255,255,.06);
    color: var(--muted);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 999px;
  }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; font-style: italic; padding-left: 6px; }

  .composer {
    display: flex; gap: 10px;
    padding: 12px;
    border-top: 1px solid rgba(255,255,255,.07);
    background: var(--panel2);
  }
  .composer input {
    flex: 1;
    min-width: 0;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 16px;
  }
  .composer input:focus { outline: 2px solid var(--accent); }
  .composer button {
    flex-shrink: 0;
    white-space: nowrap;
  }
  .hint { text-align:center; color: var(--muted); font-size: 12px; margin-top: 10px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--accent2); color: #052; font-weight: 700;
    padding: 12px 22px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  @media (max-width: 640px) {
    header { padding: 10px 12px; gap: 8px; border-radius: 14px; }
    .logo { width: 36px; height: 36px; font-size: 18px; }
    .title { font-size: 16px; }
    .subtitle { font-size: 11px; }
    .status { padding: 6px 10px; font-size: 13px; }
    .invite { margin-top: 8px; padding: 10px 12px; border-radius: 14px; }
    .invite-label { font-size: 12px; }
    .invite-row { flex-wrap: nowrap; }
    .invite-link { min-width: 0; padding: 10px 12px; font-size: 13px; }
    .chat { margin-top: 8px; border-radius: 14px; }
    .messages { padding: 12px; }
    .msg { max-width: 82%; font-size: 15px; }
    .composer { padding: 8px; gap: 8px; }
    .composer input { padding: 12px 14px; }
    .composer button { padding: 12px 16px; }
    button { padding: 12px 14px; }
    .hint { font-size: 11px; margin-top: 6px; }
  }
  @media (max-width: 380px) {
    .subtitle { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">💬</div>
    <div>
      <div class="title">Анонимный чат</div>
      <div class="subtitle">Без регистрации · без ботов · бесплатно</div>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="countText">1 человек</span>
    </div>
  </header>

  <div class="invite">
    <div class="invite-label">🔗 Ваша личная ссылка-приглашение (отправьте её собеседнику):</div>
    <div class="invite-row">
      <div class="invite-link" id="inviteLink">…</div>
      <button id="copyBtn">Скопировать</button>
    </div>
  </div>

  <div class="chat">
    <div class="messages" id="messages"></div>
    <div class="composer">
      <input type="text" id="input" placeholder="Напишите сообщение…" autocomplete="off" maxlength="4000">
      <button id="sendBtn">Отправить</button>
    </div>
  </div>

  <div class="hint">Комната приватная — в неё попадёт только тот, у кого есть ваша ссылка.</div>
</div>

<div class="toast" id="toast">Ссылка скопирована ✓</div>

<script>
(function () {
  function genCode() {
    const a = new Uint8Array(9);
    (crypto.getRandomValues ? crypto.getRandomValues(a) : a.fill(Math.random()*255));
    return Array.from(a, b => ('0' + (b & 0xff).toString(16)).slice(-2)).join('');
  }

  let room = null;
  const m = location.pathname.match(/^\/r\/([a-zA-Z0-9]+)/);
  if (m) {
    room = m[1];
  } else {
    room = genCode();
    history.replaceState(null, '', '/r/' + room);
  }

  const inviteUrl = location.origin + '/r/' + room;
  document.getElementById('inviteLink').textContent = inviteUrl;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const copyBtn = document.getElementById('copyBtn');
  const countText = document.getElementById('countText');
  const dot = document.getElementById('dot');
  const toast = document.getElementById('toast');

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(inviteUrl);
      showToast('Ссылка скопирована ✓');
    } catch (e) {
      const t = document.createElement('textarea');
      t.value = inviteUrl; document.body.appendChild(t);
      t.select(); document.execCommand('copy'); document.body.removeChild(t);
      showToast('Ссылка скопирована ✓');
    }
  });

  function addMessage(text, who, time) {
    const el = document.createElement('div');
    el.className = 'msg ' + (who === 'me' ? 'me' : 'them');
    el.textContent = text;
    const t = document.createElement('span');
    t.className = 'time';
    const d = new Date(time || Date.now());
    t.textContent = d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    el.appendChild(t);
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function addSystem(text) {
    const el = document.createElement('div');
    el.className = 'sys';
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setCount(n) {
    const word = n === 1 ? 'человек' : (n >= 2 && n <= 4 ? 'человека' : 'человек');
    countText.textContent = n + ' ' + word;
    dot.classList.toggle('on', n >= 2);
  }

  let ws;
  let typingEl = null;
  let typingTimer = null;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host);

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'join', room: room }));
    };

    ws.onmessage = (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch { return; }

      if (data.type === 'joined') {
        setCount(data.count);
        addSystem('Вы вошли в чат. Отправьте ссылку собеседнику, чтобы начать общение.');
      } else if (data.type === 'count') {
        setCount(data.count);
      } else if (data.type === 'system') {
        addSystem(data.text);
      } else if (data.type === 'chat') {
        removeTyping();
        addMessage(data.text, 'them', data.ts);
      } else if (data.type === 'typing') {
        showTyping();
      }
    };

    ws.onclose = () => {
      dot.classList.remove('on');
      addSystem('Соединение потеряно. Переподключение…');
      setTimeout(connect, 1500);
    };
  }

  function showTyping() {
    if (!typingEl) {
      typingEl = document.createElement('div');
      typingEl.className = 'typing';
      typingEl.textContent = 'Собеседник печатает…';
      messagesEl.appendChild(typingEl);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(removeTyping, 2500);
  }
  function removeTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
    clearTimeout(typingTimer);
  }

  function send() {
    const text = inputEl.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'chat', text: text }));
    addMessage(text, 'me');
    inputEl.value = '';
    inputEl.focus();
  }

  sendBtn.addEventListener('click', send);
  sendBtn.addEventListener('touchend', (e) => { e.preventDefault(); send(); }, { passive: false });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  inputEl.addEventListener('input', () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'typing' }));
    }
  });

  function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
  window.addEventListener('resize', scrollBottom);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scrollBottom);
  }
  inputEl.addEventListener('focus', () => setTimeout(scrollBottom, 300));

  connect();
})();
</script>
</body>
</html>
